<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  #dbg{position:absolute;left:0;right:0;top:0;z-index:5;padding:3px 6px;font-size:11px;color:#9f9;
       background:rgba(0,0,0,.75);transition:opacity .6s;pointer-events:none}
</style>
</head>
<body>
<div id="dbg">page loaded, starting...</div>
<script>
  var dbg = document.getElementById('dbg');
  function say(t) { dbg.textContent = t; }
  window.onerror = function (m) { say('JS error: ' + m); };
  try {
    var ua = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '?';
    var p = new URLSearchParams(location.search);
    var v = p.get('v') || '';
    var list = p.get('list') || '';
    var idOk = /^[\w-]{11}$/.test(v);
    var listOk = /^[\w-]+$/.test(list);
    if (idOk || listOk) {
      var src = 'https://www.youtube.com/embed/' + (idOk ? v : 'videoseries') +
        '?autoplay=1&rel=0&playsinline=1&origin=' + encodeURIComponent(location.origin) +
        (listOk ? '&list=' + list : '');
      var f = document.createElement('iframe');
      f.src = src;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      f.allowFullscreen = true;
      f.onload = function () { say('Chromium ' + ua + ' | YouTube frame loaded'); };
      document.body.appendChild(f);
      say('Chromium ' + ua + ' | page ok | loading ' + (idOk ? v : list));
    } else {
      say('Chromium ' + ua + ' | no valid video id in the address');
    }
  } catch (e) { say('Error: ' + e.message); }
  setTimeout(function () { dbg.style.opacity = 0; }, 8000);
</script>
</body>
</html>
